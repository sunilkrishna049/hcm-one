services:
  - type: web
    name: ai-payroll-assistant-backend
    env: python
    buildCommand: "pip install -r app/backend/requirements.txt"
    startCommand: "uvicorn app.backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: AI_MODE
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
      - key: FRONTEND_ORIGIN
        sync: false

